name: Project Moon Discord Relay

on:
  # Primary trigger: cron-job.org → workflow_dispatch every minute.
  # No schedule: doubles triggers and burns private-repo minutes.
  workflow_dispatch:
  repository_dispatch:
    types: [relay]

permissions:
  contents: write

concurrency:
  group: relay-singleton
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync latest state
        run: |
          git pull --rebase origin main || true

      - name: Run relay
        env:
          # Server 1 (primary). Extra servers: same name + _2 … _9 (unset = skip).
          DISCORD_WEBHOOK_PROJMOON: ${{ secrets.DISCORD_WEBHOOK_PROJMOON }}
          DISCORD_WEBHOOK_HHPP: ${{ secrets.DISCORD_WEBHOOK_HHPP }}
          DISCORD_WEBHOOK_LIMBUS: ${{ secrets.DISCORD_WEBHOOK_LIMBUS }}
          DISCORD_WEBHOOK_YOUTUBE: ${{ secrets.DISCORD_WEBHOOK_YOUTUBE }}
          DISCORD_WEBHOOK_PROJMOON_2: ${{ secrets.DISCORD_WEBHOOK_PROJMOON_2 }}
          DISCORD_WEBHOOK_HHPP_2: ${{ secrets.DISCORD_WEBHOOK_HHPP_2 }}
          DISCORD_WEBHOOK_LIMBUS_2: ${{ secrets.DISCORD_WEBHOOK_LIMBUS_2 }}
          DISCORD_WEBHOOK_YOUTUBE_2: ${{ secrets.DISCORD_WEBHOOK_YOUTUBE_2 }}
          DISCORD_WEBHOOK_PROJMOON_3: ${{ secrets.DISCORD_WEBHOOK_PROJMOON_3 }}
          DISCORD_WEBHOOK_HHPP_3: ${{ secrets.DISCORD_WEBHOOK_HHPP_3 }}
          DISCORD_WEBHOOK_LIMBUS_3: ${{ secrets.DISCORD_WEBHOOK_LIMBUS_3 }}
          DISCORD_WEBHOOK_YOUTUBE_3: ${{ secrets.DISCORD_WEBHOOK_YOUTUBE_3 }}
          DISCORD_WEBHOOK_PROJMOON_4: ${{ secrets.DISCORD_WEBHOOK_PROJMOON_4 }}
          DISCORD_WEBHOOK_HHPP_4: ${{ secrets.DISCORD_WEBHOOK_HHPP_4 }}
          DISCORD_WEBHOOK_LIMBUS_4: ${{ secrets.DISCORD_WEBHOOK_LIMBUS_4 }}
          DISCORD_WEBHOOK_YOUTUBE_4: ${{ secrets.DISCORD_WEBHOOK_YOUTUBE_4 }}
          DISCORD_WEBHOOK_PROJMOON_5: ${{ secrets.DISCORD_WEBHOOK_PROJMOON_5 }}
          DISCORD_WEBHOOK_HHPP_5: ${{ secrets.DISCORD_WEBHOOK_HHPP_5 }}
          DISCORD_WEBHOOK_LIMBUS_5: ${{ secrets.DISCORD_WEBHOOK_LIMBUS_5 }}
          DISCORD_WEBHOOK_YOUTUBE_5: ${{ secrets.DISCORD_WEBHOOK_YOUTUBE_5 }}
          DISCORD_WEBHOOK_PROJMOON_6: ${{ secrets.DISCORD_WEBHOOK_PROJMOON_6 }}
          DISCORD_WEBHOOK_HHPP_6: ${{ secrets.DISCORD_WEBHOOK_HHPP_6 }}
          DISCORD_WEBHOOK_LIMBUS_6: ${{ secrets.DISCORD_WEBHOOK_LIMBUS_6 }}
          DISCORD_WEBHOOK_YOUTUBE_6: ${{ secrets.DISCORD_WEBHOOK_YOUTUBE_6 }}
          DISCORD_WEBHOOK_PROJMOON_7: ${{ secrets.DISCORD_WEBHOOK_PROJMOON_7 }}
          DISCORD_WEBHOOK_HHPP_7: ${{ secrets.DISCORD_WEBHOOK_HHPP_7 }}
          DISCORD_WEBHOOK_LIMBUS_7: ${{ secrets.DISCORD_WEBHOOK_LIMBUS_7 }}
          DISCORD_WEBHOOK_YOUTUBE_7: ${{ secrets.DISCORD_WEBHOOK_YOUTUBE_7 }}
          DISCORD_WEBHOOK_PROJMOON_8: ${{ secrets.DISCORD_WEBHOOK_PROJMOON_8 }}
          DISCORD_WEBHOOK_HHPP_8: ${{ secrets.DISCORD_WEBHOOK_HHPP_8 }}
          DISCORD_WEBHOOK_LIMBUS_8: ${{ secrets.DISCORD_WEBHOOK_LIMBUS_8 }}
          DISCORD_WEBHOOK_YOUTUBE_8: ${{ secrets.DISCORD_WEBHOOK_YOUTUBE_8 }}
          DISCORD_WEBHOOK_PROJMOON_9: ${{ secrets.DISCORD_WEBHOOK_PROJMOON_9 }}
          DISCORD_WEBHOOK_HHPP_9: ${{ secrets.DISCORD_WEBHOOK_HHPP_9 }}
          DISCORD_WEBHOOK_LIMBUS_9: ${{ secrets.DISCORD_WEBHOOK_LIMBUS_9 }}
          DISCORD_WEBHOOK_YOUTUBE_9: ${{ secrets.DISCORD_WEBHOOK_YOUTUBE_9 }}
        run: python run.py

      - name: Persist state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data
          for i in 1 2 3 4 5; do
            git add data/state.json || true
            if git diff --cached --quiet; then
              echo "No state changes"
              exit 0
            fi
            git commit -m "chore: update relay state [skip ci]" || true
            git pull --rebase origin main || true
            if git push; then
              echo "State pushed"
              exit 0
            fi
            echo "Push failed, retry $i"
            sleep 2
          done
          echo "Failed to persist state after retries"
          exit 1
